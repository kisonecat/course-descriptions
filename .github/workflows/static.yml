# Build the course description PDFs and publish them to GitHub Pages.
name: Build .pdf files from .tex files

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup TeXLive
        uses: TeX-Live/setup-texlive-action@v4
        with:
          # latexmk is a Perl script; perl is already on ubuntu-latest.
          # hyperref and its oberdiek dependencies used to arrive transitively;
          # pin them so a TeX Live update cannot quietly drop them.
          packages: >-
            scheme-basic
            latexmk
            fontspec
            xetex
            pgf
            tex-gyre
            tex-gyre-math
            geometry
            soul
            xcolor
            titlesec
            fancyhdr
            etoolbox
            amsmath
            hyperref
            url
            infwarerr
            kvoptions
            ltxcmds
            pdfescape
            bitset
            intcalc
            etexcmds
            refcount
            rerunfilecheck
            uniquecounter
            zapfding
            symbol
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y tex-gyre
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the PDFs
        run: make
      - name: Verify the catalog data is current and complete
        run: make check
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository, so the .tex sources, osucourse.cls and
          # coursedata.tex are published alongside the PDFs.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
